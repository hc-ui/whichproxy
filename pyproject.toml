[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "whichproxy"
version = "0.4.1"
description = "See whether a host uses your proxy or slips through NO_PROXY — built for AI CLIs on Clash."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hc-ui" }]
keywords = ["proxy", "no_proxy", "clash", "codex", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[project.scripts]
whichproxy = "whichproxy.cli:main"

[project.urls]
Homepage = "https://github.com/hc-ui/whichproxy"
Issues = "https://github.com/hc-ui/whichproxy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whichproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
